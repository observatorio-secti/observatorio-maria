[project]
name = "observatorio-maria"
version = "0.1.0"
description = "Observatório Maria - API FastAPI"
authors = [
    {name = "Observatório Maria Team", email = "contato@observatoriomaria.org"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "openinference-instrumentation-langchain>=0.1.79",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "duckdb (>=2.0)",
]

[tool.poetry]
packages = [{include = "observatorio_maria", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
taskipy = "^1.14.0"
ruff = "^0.7.0"
httpx = "^0.27.2"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
run = 'fastapi dev src/observatorio_maria/app.py'
seed = 'python -m observatorio_maria.catalog.seed catalog/*.yaml'
eval = 'python -m observatorio_maria.evaluation'
duckdb-extensions = 'python -c "import duckdb; c = duckdb.connect(); [c.install_extension(e) for e in (\"postgres\", \"sqlite\")]"'
pre_test = 'task lint'
test = 'pytest -s -x --cov=observatorio_maria -vv'
post_test = 'coverage html'
