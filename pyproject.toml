[project]
name = "observatorio-maria"
version = "0.1.0"
description = "Observatório Maria - API FastAPI"
authors = [
    {name = "Observatório Maria Team", email = "contato@observatoriomaria.org"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "python-dotenv>=1.0",
]

[tool.poetry]
packages = [{include = "observatorio_maria", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
taskipy = "^1.14.0"
ruff = "^0.7.0"
httpx = "^0.27.2"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
run = 'fastapi dev src/observatorio_maria/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=observatorio_maria -vv'
post_test = 'coverage html'
