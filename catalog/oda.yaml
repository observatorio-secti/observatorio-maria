        description: Identificador interno, usado apenas em junções.
        list_values: never
      - name: grupo_id
        description: Grupo ao qual a linha pertence.
        list_values: never
      - name: dgp_id
        label: Identificador DGP
        list_values: never
      - name: titulo
        label: Título
        searchable: true
        list_values: never
      - name: objetivo
        label: Objetivo
        searchable: true
        list_values: never

