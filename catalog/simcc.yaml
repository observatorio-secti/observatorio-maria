# Seed do catálogo do banco de leitura do Simcc.
#
# É só o ponto de partida: o seed cria o que ainda não existe e nunca
# sobrescreve o que foi editado depois pela API ou pela demo. Para recriar a
# fonte a partir deste arquivo, descartando edições: task seed -- --reset
#
# Só as colunas listadas ficam visíveis. Arrays, JSON, tsvector, URLs e campos
# internos do ETL (sequence_code, is_new, stars, has_image, relevance...)
# entram ocultos na sincronização, assim como as demais tabelas do Simcc.
# Os relacionamentos vêm das chaves estrangeiras da origem. Os valores das
# colunas categóricas (type, qualis, nature...) são lidos dos dados.
#
# `list_values: never` marca colunas de texto que não são categorias (nomes,
# códigos, datas e indicadores guardados como texto): os valores podem ser
# lidos da origem, mas não vão para o contexto do modelo.

datasource:
  id: simcc
  name: Produção científica (Simcc)
  description: >-
    Currículo Lattes dos pesquisadores da Bahia no Simcc: artigos, livros,
    capítulos, patentes, softwares, participação em eventos e projetos de
    pesquisa.
  connection_env: SIMCC_DATABASE_URL
  schemas: [public]
  instructions: |
    - Banco PostgreSQL. Os identificadores (`id`, `canonical_id` e colunas `*_id`, exceto `lattes_id`) são UUIDs internos: use-os só em junções e nunca os mostre ao usuário.
    - As tabelas base (`bibliographic_production`, `patent`, `software`, `participation_events`, `research_project` e as tabelas ligadas a elas) têm uma linha por pesquisador autor: um artigo de três coautores da plataforma aparece três vezes. Use-as para perguntas sobre um pesquisador ou uma lista de pesquisadores, partindo de `researcher`.
    - Para totais de produções (por ano, Qualis, categoria, tipo de participação etc.), use as views `mv_canonical_*`, que têm uma linha por produção sem repetir coautores. Elas são atualizadas pelo Simcc e podem estar defasadas em relação às tabelas base.
    - `bibliographic_production` guarda artigos, livros, capítulos e trabalhos em eventos; o tipo está em `type`, e os detalhes ficam em `bibliographic_production_article`, `bibliographic_production_book` e `bibliographic_production_book_chapter`, ligadas por `bibliographic_production_id`. O ano está em `year_` (número).
    - Um pesquisador pode ter várias instituições, ligadas por `researcher_institution` (`researcher_id`, `institution_id`). Para pesquisadores por instituição, junte `researcher`, `researcher_institution` e `institution` e conte com `COUNT(DISTINCT r.id)`; somar instituições pode contar o mesmo pesquisador mais de uma vez. Não há correspondência entre `institution` e as instituições do fomento.
    - `researcher_production` tem as contagens de produção de cada pesquisador, prontas para rankings.
    - Ligação com o fomento: `researcher.lattes_id` é o mesmo identificador de `pesquisadores.lattes` na fonte `fomento`. Cada consulta acessa uma só fonte. Para relacionar as duas, consulte uma delas e filtre a outra com os Lattes obtidos (`lattes_id IN (...)`), no máximo 100 por consulta.
    - Nem todo bolsista do fomento está no Simcc: ao relacionar as fontes, diga quantos dos Lattes consultados foram encontrados. Perguntas que exigem agregar mais de 100 pesquisadores das duas fontes ainda não podem ser respondidas; diga isso ao usuário.
  examples:
    - question: "Quantos artigos foram publicados por ano a partir de 2020?"
      sql: >-
        SELECT year, COUNT(*) AS artigos FROM public.mv_canonical_articles WHERE year >= 2020 GROUP BY year ORDER BY year
    - question: "Quais artigos Qualis A1 tem o pesquisador de Lattes 1234567890123456?"
      sql: >-
        SELECT bp.title, bp.year_, a.periodical_magazine_name FROM public.researcher r JOIN public.bibliographic_production bp ON bp.researcher_id = r.id JOIN public.bibliographic_production_article a ON a.bibliographic_production_id = bp.id WHERE r.lattes_id = '1234567890123456' AND a.qualis = 'A1' ORDER BY bp.year_ DESC
    - question: "Quantas patentes foram concedidas desde 2020?"
      sql: >-
        SELECT COUNT(*) FROM public.mv_canonical_patents WHERE grant_date >= '2020-01-01'
    - question: "Projetos de pesquisa do currículo sobre educação"
      sql: >-
        SELECT title, start_year, agency_name FROM public.mv_canonical_research_projects WHERE MATCH_TEXT(title, 'educação') ORDER BY start_year DESC
    - question: "Quais pesquisadores têm mais artigos?"
      sql: >-
        SELECT r.name, rp.articles FROM public.researcher_production rp JOIN public.researcher r ON r.id = rp.researcher_id ORDER BY rp.articles DESC LIMIT 10


entities:
  - name: researcher
    label: Pesquisadores
    description: Pesquisadores com currículo Lattes processado pelo Simcc.
    synonyms: [pesquisador, pesquisadora, docente, autor, currículo]
    columns:
      - name: id
        description: Identificador interno.
      - name: name
        label: Nome
        searchable: true
      - name: lattes_id
        label: Lattes
        description: Identificador do currículo Lattes (CNPq); igual a pesquisadores.lattes no fomento.
      - name: orcid
        list_values: never
        label: ORCID
      - name: abstract
        label: Resumo do currículo
        searchable: true
      - name: last_update
        label: Atualização do Lattes
        description: Data da última atualização do currículo Lattes.
      - name: city_id
        description: Cidade do pesquisador.

  - name: institution
    label: Instituições
    synonyms: [instituição, universidade]
    columns:
      - name: id
        description: Identificador interno.
      - name: name
        list_values: never
        label: Nome
      - name: acronym
        label: Sigla

  - name: researcher_institution
    label: Instituições dos pesquisadores
    description: >-
      Liga cada pesquisador às suas instituições de afiliação; um pesquisador
      pode ter mais de uma.
    synonyms: [afiliação, vínculo institucional]
    columns:
      - name: researcher_id
        description: Pesquisador.
      - name: institution_id
        description: Instituição.
      - name: workload
        label: Carga horária
        description: Carga horária semanal do pesquisador na instituição, em horas.
      - name: identity_territory
        label: Território de identidade
        description: Território de identidade da Bahia do vínculo.

  - name: city
