# Produção da Maria, isolada do observatório de fomento.
#   docker compose -f compose.prod.yaml up -d --build
#
# Projeto e volume próprios. Conversas e catálogo ficam num arquivo SQLite no
# volume maria_data. A API só entra na rede do fomento para ler o banco dele
# (FOMENTO_DATABASE_URL apontando para o host "db").
name: observatorio-maria

services:
  maria-api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/maria.db
      ENVIRONMENT: production
    volumes:
      - maria_data:/app/data
    ports:
      - "${MARIA_API_PORT:-11309}:8000"
    networks: [fomento]
    restart: unless-stopped

networks:
  fomento:
    external: true
    name: ${FOMENTO_NETWORK:?Configure FOMENTO_NETWORK com a rede do compose do fomento (docker network ls)}

volumes:
  maria_data:
