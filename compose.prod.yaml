# Produção da Maria, isolada do observatório de fomento.
#   docker compose -f compose.prod.yaml up -d --build
#
# Projeto e volume próprios. Conversas e catálogo ficam num arquivo SQLite no
# volume maria_data. A API entra nas redes externas das fontes para consultas
# com credenciais somente leitura.
name: observatorio-maria

services:
  maria-api:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/maria.db
      ENVIRONMENT: production
    volumes:
      - maria_data:/app/data
    ports:
      - "${MARIA_API_PORT:-11309}:8000"
    networks: [fomento, simcc, oda]
    restart: unless-stopped

networks:
  fomento:
    external: true
    name: ${FOMENTO_NETWORK:?Configure FOMENTO_NETWORK com a rede do compose do fomento (docker network ls)}
  simcc:
    external: true
    name: ${SIMCC_NETWORK:-simcc-network}
  oda:
    external: true
    name: ${ODA_NETWORK:-maria_IA}

volumes:
  maria_data:
